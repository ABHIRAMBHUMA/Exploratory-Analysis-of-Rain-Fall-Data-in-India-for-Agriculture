<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rainfall Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4 text-primary">🌧 Rainfall Prediction System</h2>

        <form action="/predict" method="post">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Min Temperature</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="MinTemp"
                           placeholder="Range: -8.5 to 33.9"
                           min="-8.5" max="33.9"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Max Temperature</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="MaxTemp"
                           placeholder="Range: -4.8 to 48.1"
                           min="-4.8" max="48.1"
                           required>
                </div>
            </div>


            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Rainfall</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="Rainfall"
                           placeholder="Range: 0 to 371"
                           min="0" max="371"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Humidity (9 AM)</label>
                    <input type="number" step="any"
                           class="form-control"
                           name="Humidity9am"
                           placeholder="Range: 0 to 100"
                           min="0" max="100"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Pressure (9 AM)</label>
                <input type="number" step="any"
                       class="form-control"
                       name="Pressure9am"
                       placeholder="Range: 980 to 1040"
                       min="980" max="1040"
                       required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg w-50">
                    Predict
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
