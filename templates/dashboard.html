<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">📊 Rainfall Analytics Dashboard</h2>

    <div class="row text-center mb-4">
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Total Records</h5>
                <h3>{{ total }}</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Rain Days</h5>
                <h3>{{ rain }}</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>No Rain Days</h5>
                <h3>{{ no_rain }}</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow p-3">
                <img src="{{ url_for('static', filename='plots/rain_distribution.png') }}" class="img-fluid">
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow p-3">
                <img src="{{ url_for('static', filename='plots/heatmap.png') }}" class="img-fluid">
            </div>
        </div>
    </div>

    <div class="card shadow p-3">
        <img src="{{ url_for('static', filename='plots/rainfall_dist.png') }}" class="img-fluid">
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Back to Prediction</a>
    </div>

</div>

</body>
</html>
